name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "TDS identity: 23f1000931@ds.study.iitm.ac.in"
        run: 'echo "TDS identity: 23f1000931@ds.study.iitm.ac.in"'

      - name: Install dependencies
        run: npm install
      

      - name: Run release-gate policy tests
        run: npm test
